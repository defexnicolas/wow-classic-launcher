name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (csc de .NET Framework 4.8, el mismo que build.cmd)
        shell: cmd
        run: build.cmd

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ClassicForever.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ClassicForever.exe" | Out-File -Encoding ascii dist/ClassicForever.exe.sha256
          Write-Host "SHA-256: $h"
          "SHA256=$h" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicForever
          path: dist/

      - name: Publicar release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Compilado por GitHub Actions desde el commit $env:GITHUB_SHA ([registro del build]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)).

          **SHA-256:** ``$env:SHA256``

          Windows mostrará "Windows protegió su PC" porque el ejecutable no está firmado: pulsa **Más información → Ejecutar de todas formas**. Ver el README.
          "@
          gh release create $env:GITHUB_REF_NAME dist/ClassicForever.exe dist/ClassicForever.exe.sha256 linux/classic-forever-linux.py --title "Classic Forever Launcher $env:GITHUB_REF_NAME" --notes $notes
